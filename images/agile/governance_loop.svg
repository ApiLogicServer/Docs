<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5f6b76"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- background card (keeps it legible on dark themes) -->
  <rect x="1" y="1" width="898" height="288" rx="8" fill="#f7f8f9" stroke="#d9dde1"/>

  <!-- top row -->
  <rect x="20" y="36" width="150" height="56" rx="6" fill="#ffffff" stroke="#9aa4af"/>
  <text x="95" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#333333">requirements</text>
  <text x="95" y="78" text-anchor="middle" font-size="11" fill="#666666">natural language</text>

  <rect x="360" y="36" width="230" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#333333">rules</text>
  <text x="475" y="78" text-anchor="middle" font-size="11" fill="#666666">executable documentation</text>

  <rect x="700" y="36" width="180" height="56" rx="6" fill="#ffffff" stroke="#9aa4af"/>
  <text x="790" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#333333">running system</text>
  <text x="790" y="78" text-anchor="middle" font-size="11" fill="#666666">engine enforces rules on every commit</text>

  <!-- forward arrows -->
  <line x1="170" y1="64" x2="356" y2="64" stroke="#5f6b76" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="265" y="54" text-anchor="middle" font-size="11.5" fill="#555555">AI + context engineering</text>

  <line x1="590" y1="64" x2="696" y2="64" stroke="#5f6b76" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="643" y="54" text-anchor="middle" font-size="11.5" fill="#555555">loaded into</text>

  <!-- rules read by AI: fan to generated artifacts -->
  <line x1="475" y1="92" x2="475" y2="156" stroke="#5f6b76" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="487" y="128" text-anchor="start" font-size="11.5" fill="#555555">AI reads the rules</text>

  <!-- generated group -->
  <rect x="240" y="160" width="480" height="80" rx="6" fill="none" stroke="#c3ccd4" stroke-dasharray="4 4"/>
  <text x="252" y="175" font-size="10.5" fill="#77828c">generated from the rules</text>

  <rect x="256" y="182" width="128" height="48" rx="5" fill="#ffffff" stroke="#9aa4af"/>
  <text x="320" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">tests</text>
  <text x="320" y="217" text-anchor="middle" font-size="10.5" fill="#666666">drive the system</text>

  <rect x="400" y="182" width="150" height="48" rx="5" fill="#ffffff" stroke="#9aa4af"/>
  <text x="475" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">logic diagrams</text>
  <text x="475" y="217" text-anchor="middle" font-size="10.5" fill="#666666">per requirement</text>

  <rect x="566" y="182" width="144" height="48" rx="5" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="638" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">this report</text>
  <text x="638" y="217" text-anchor="middle" font-size="10.5" fill="#2b6cb0">read &#183; trust &#183; maintain</text>

  <!-- running system feeds the report -->
  <path d="M 790 92 L 790 206 L 726 206" fill="none" stroke="#5f6b76" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="783" y="150" text-anchor="end" font-size="11.5" fill="#555555">logic logs</text>

  <!-- maintain: back to requirements -->
  <path d="M 638 240 L 638 262 L 95 262 L 95 96" fill="none" stroke="#2b6cb0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="366" y="254" text-anchor="middle" font-size="11.5" fill="#2b6cb0">maintain: edit a requirement, re-implement</text>
</svg>
