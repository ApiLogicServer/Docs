name: ApiLogicServer
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"   # pinned (was 3.x), same as the local Docs venv: the mkdocs 1.6.1 stack is frozen, so freeze Python too
      - uses: actions/cache@v3
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force --config-file=mkdocs.yml
